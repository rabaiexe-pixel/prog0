<!doctype html>
<html>

<head>
    <title>Hello</title>
   <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.js"></script>
    
</head>

<body>
    <script>
let CELL = 40;


let COLOR = {
  r: 50,
  g: 100,
  b: 200,
};
let direction = {
    x: CELL,
    y: 0
};
let snake = [{x:400, y:400},
{x:400 + CELL, y:400},
{x:400 + 2*CELL, y:400},
{x:400 + 3*CELL, y:400}];




// Called by the p5 framework, after it is loaded
// https://p5js.org/reference/p5/setup/
function setup() {
  createCanvas(800, 800);
  frameRate(5); // call draw X times a second
}

// Called by the p5 framework periodically
// https://p5js.org/reference/p5/draw/
function draw() {
  background(240);
    

//if (POS.x <= 0 || POS.y <= 0 || POS.x >= 800 || POS.y >= 800){
//    noLoop();
//}

snake.pop();

let first = structuredClone (snake[0]);
first.y += direction.y;
first.x += direction.x;
snake.splice(0,0,first);


  fill(color(COLOR.r, COLOR.g, COLOR.b));
  for (let i of snake){
    circle(i.x, i.y, CELL);
  }

  let c = structuredClone(COLOR);
  COLOR.r = c.g;
  COLOR.g = c.b;
  COLOR.b = c.r;
}

// Called by the p5 framework when a key is pressed by the user
// https://p5js.org/reference/p5/keyPressed/
function keyPressed(event) {
  let ndir;
  ndir ={};
  if (key == 'ArrowUp') {
    ndir.x = 0;
    ndir.y = -1*CELL;
  } else if (key == 'ArrowDown') {
    ndir.x = 0;
    ndir.y = 1*CELL;
  } else if (key == 'ArrowLeft') {
    ndir.x = -1*CELL;
    ndir.y = 0;
  } else if (key == 'ArrowRight') {
    ndir.x = 1*CELL;
    ndir.y = 0;
  } else {
    return true;
  }
let rdir = structuredClone(ndir);
rdir.x = -1*ndir.x;
rdir.y = -1*ndir.y;

if ((rdir.x == direction.x && rdir.y == direction.y) == false){
  direction = ndir;
}

  return false;
}
    </script>
</body>
</html>
