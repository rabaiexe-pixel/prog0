<!doctype html>
<html>

<head>
    <title>Hello</title>
   <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.js"></script>
    
</head>

<body>
    <script>
let CELL = 40;


let COLOR = {
  r: 50,
  g: 100,
  b: 200,
};
let direction = {
    x: -CELL,
    y: 0
};
const ORIGO = {
  x: 400+CELL/2,
  y: 400+CELL/2
};
let snake = [{x:ORIGO.x, y:ORIGO.y},
{x:ORIGO.x + CELL, y:ORIGO.y},
{x:ORIGO.x + 2*CELL, y:ORIGO.y},
{x:ORIGO.x + 3*CELL, y:ORIGO.y}];



// Called by the p5 framework, after it is loaded
// https://p5js.org/reference/p5/setup/
function setup() {
  createCanvas(800, 800);
  frameRate(5); // call draw X times a second
}

// Called by the p5 framework periodically
// https://p5js.org/reference/p5/draw/
function draw() {
  background(240);



let first = structuredClone (snake[0]);
first.y += direction.y;
first.x += direction.x;

if (first.x <= 0 || first.y <= 0 || first.x >= 800 || first.y >= 800){
  noLoop();

}
else {snake.pop();

snake.splice(0,0,first);
}



  fill(color(COLOR.r, COLOR.g, COLOR.b));
  for (let i of snake){
    circle(i.x, i.y, CELL);
  }

  let c = structuredClone(COLOR);
  COLOR.r = c.g;
  COLOR.g = c.b;
  COLOR.b = c.r;
}

// Called by the p5 framework when a key is pressed by the user
// https://p5js.org/reference/p5/keyPressed/
function keyPressed(event) {
  let ndir;
  ndir ={};
  if (key == 'ArrowUp') {
    ndir.x = 0;
    ndir.y = -1*CELL;
  } else if (key == 'ArrowDown') {
    ndir.x = 0;
    ndir.y = 1*CELL;
  } else if (key == 'ArrowLeft') {
    ndir.x = -1*CELL;
    ndir.y = 0;
  } else if (key == 'ArrowRight') {
    ndir.x = 1*CELL;
    ndir.y = 0;
  } else {
    return true;
  }
let rdir = structuredClone(ndir);
rdir.x = -1*ndir.x;
rdir.y = -1*ndir.y;

if ((rdir.x == direction.x && rdir.y == direction.y) == false){
  direction = ndir;
}

  return false;
}
    </script>
</body>
</html>
